name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY }}/chainlake/chainlake-slayer
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chainlake
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via ArgoCD
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/download/v3.4.3/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          ARGOCD_COMMON=(
            --server argocd.chainlake.io
            --grpc-web
            --header "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}"
            --header "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
            --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}"
          )
          retry_op() {
            local tries=0
            while [ $tries -lt 6 ]; do
              tries=$((tries + 1))
              OUT=$(argocd "$@" 2>&1) && { echo "$OUT"; return 0; }
              echo "$OUT" | grep -q "already in progress" || { echo "$OUT"; return 1; }
              echo "operation in progress, retry $tries/6 in 20s..."
              sleep 20
            done
            echo "$OUT"
            return 1
          }
          retry_op app set slayer "${ARGOCD_COMMON[@]}" \
            --kustomize-image "chainlake-slayer=${{ steps.meta.outputs.tags }}"
          retry_op app sync slayer "${ARGOCD_COMMON[@]}" --async
          argocd app wait slayer "${ARGOCD_COMMON[@]}" --health --timeout 600
