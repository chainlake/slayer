name: Build, Push, and Bump VPS Image

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: build-slayer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
      INFRA_REPO: chainlake/chainlake-infra
      INFRA_PATH: gitops/environments/vps/manifests/slayer
      IMAGE_NAME: chainlake-slayer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY }}/chainlake/chainlake-slayer
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chainlake
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve immutable image reference
        id: image
        run: |
          ref=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep -v ':latest$' | head -n1)
          if [ -z "$ref" ]; then
            echo "::error::No sha-tagged image reference was produced."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Skip GitOps bump (token not configured)
        if: env.INFRA_REPO_TOKEN == ''
        run: |
          echo "::warning::Image pushed to ACR, but INFRA_REPO_TOKEN is not configured; the VPS image tag was not updated."

      - name: Checkout infra repo
        if: env.INFRA_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          ref: main
          token: ${{ env.INFRA_REPO_TOKEN }}
          path: infra
          fetch-depth: 0

      - name: Install kustomize
        if: env.INFRA_REPO_TOKEN != ''
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tag in GitOps
        if: env.INFRA_REPO_TOKEN != ''
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd "infra/$INFRA_PATH"
          kustomize edit set image "$IMAGE_NAME=$IMAGE_REF"
          cd "$GITHUB_WORKSPACE/infra"
          git config user.name "chainlake-ci"
          git config user.email "ci@chainlake.io"
          git add "$INFRA_PATH/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "Image tag already current."
            exit 0
          fi
          git commit -m "chore(vps): bump $IMAGE_NAME to $IMAGE_TAG"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "push rejected, retrying ($attempt/3)..."
            sleep 5
          done
          echo "::error::Could not push the image bump after 3 attempts."
          exit 1
